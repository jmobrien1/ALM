<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Marketplace | Allegiance List Marketing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --ink:#0A2342; --accent:#C22B2B; --bg:#f7f8fb; --line:#e7e8ef; }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial;background:var(--bg);color:#111}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}
    .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{height:32px}
    .brand h1{margin:0;color:var(--ink);font-size:1.25rem}
    .toolbar{max-width:1200px;margin:8px auto 0;display:flex;gap:12px;align-items:center;padding:0 16px 12px}
    input[type="search"]{flex:1;padding:10px 12px;border:1px solid #d9dce4;border-radius:10px;font-size:15px;background:#fff}
    #stats{color:#555;font-size:.9rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:16px;max-width:1200px;margin:0 auto}
    .card{background:#fff;border:1px solid #ececf3;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
    .title{font-weight:700;color:var(--ink);font-size:1rem;line-height:1.2}
    .badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#E6F2FF;color:#034EA2;font-weight:600;font-size:.75rem}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .btn{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid #dfe3ef;background:#fff;text-decoration:none;color:#111;font-weight:600}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    footer{max-width:1200px;margin:8px auto 40px;color:#666;padding:0 16px;font-size:.9rem}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="brand" href="marketplace.html" aria-label="Allegiance List Marketing">
        <img src="assets/img/alm-logo.svg" alt="Allegiance List Marketing">
        <h1>Marketplace</h1>
      </a>
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search by title, description, selects…" />
      <span id="stats">0 items</span>
    </div>
  </header>

  <main>
    <section id="dynamic-market" style="padding:0 16px 24px;max-width:1200px;margin:0 auto">
      <div id="cards-list" class="grid" aria-live="polite"></div>
    </section>

    <template id="card-tpl">
      <article class="card">
        <div class="row">
          <div class="title"></div>
          <span class="badge dsg" style="display:none">A DSG Property</span>
        </div>
        <div class="row">
          <a class="btn view" target="_self">View</a>
          <a class="btn primary request" href="#" data-action="request">Request list</a>
        </div>
      </article>
    </template>
  </main>

  <footer>Cards labeled <strong>A DSG Property</strong> are owned by Dominion Strategy Group.</footer>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script>
  (async function(){
    const cacheBust = `?v=${Date.now()}`;
    const JSON_URL = "assets/data/datacards.json" + cacheBust;

    const slugify = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const isDSG = owner => String(owner||"").trim().toLowerCase()==="dominion strategy group";

    async function getJSON(u){
      try{ const r = await fetch(u, {cache:"no-store"}); if(!r.ok) throw new Error(r.statusText); return await r.json(); }
      catch(e){ console.error("load json failed", e); return []; }
    }

    const data = await getJSON(JSON_URL);
    const items = (Array.isArray(data) ? data : []).map(d => ({
      id: String(d.id ?? ""),
      slug: d.slug || "",
      title: (d.title||"").trim(),
      owner: d.owner || "",
      shortDescription: (d.shortDescription ?? d.short_description ?? d.description ?? "").trim()
    })).filter(d => d.title);

    items.sort((a,b)=>a.title.localeCompare(b.title, undefined, {sensitivity:"base"}));

    const grid = document.getElementById("cards-list");
    const tpl  = document.getElementById("card-tpl");

    function render(list){
      grid.innerHTML = "";
      for (const d of list){
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.querySelector(".title").textContent = d.title;
        if (isDSG(d.owner)) node.querySelector(".badge.dsg").style.display = "inline-block";
        // Keep the existing datacard.html?id=… route (now redirects to the PDF)
        const id = d.id || d.slug || slugify(d.title);
        node.querySelector("a.view").href = `datacard.html?id=${encodeURIComponent(id)}`;
        node.querySelector("a.request").href = `form/request.html?card=${encodeURIComponent(id)}`;
        grid.appendChild(node);
      }
      document.getElementById("stats").textContent = `${list.length} items`;
    }

    render(items);

    // Fuzzy search
    const fuse = new Fuse(items, {keys:["title","shortDescription"], threshold:0.36, ignoreLocation:true});
    document.getElementById("q").addEventListener("input", e => {
      const q = e.target.value.trim();
      if (!q) return render(items);
      render(fuse.search(q).map(x => x.item));
    });
  })();
  </script>
</body>
</html>
